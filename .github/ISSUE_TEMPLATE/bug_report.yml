name: Bug report
description: Report a reproducible problem in Twelve Ranks.
title: "[Bug] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Twelve Ranks. Do not include passwords,
        tokens, private files, or vulnerability details in this public form.
  - type: input
    id: version
    attributes:
      label: Twelve Ranks version
      description: Enter the Store version or source commit.
      placeholder: "0.0.1 or commit SHA"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Include the Windows edition, version, and OS build when known.
      placeholder: "Windows 11 25H2, build ..."
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - x86
        - Unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Start ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized screenshots or logs and any accessibility impact.
  - type: checkboxes
    id: checks
    attributes:
      label: Public-report confirmation
      options:
        - label: I searched existing issues and removed private or security-sensitive information.
          required: true
