name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows x64 Release build and tests
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\TwelveRanks.slnx -p:Configuration=Release -p:Platform=x64

      - name: Build without packaging or launching
        shell: pwsh
        run: >-
          dotnet build .\TwelveRanks.slnx
          --configuration Release
          --no-restore
          -p:Platform=x64
          -p:ContinuousIntegrationBuild=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxPackageSigningEnabled=false

      - name: Test
        shell: pwsh
        run: >-
          dotnet test .\TwelveRanks.Tests\TwelveRanks.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "console;verbosity=normal"
