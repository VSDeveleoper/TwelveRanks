name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows x64 Release build and tests
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\TwelveRanks.slnx -p:Configuration=Release -p:Platform=x64

      - name: Build without packaging or launching
        shell: pwsh
        run: >-
          dotnet build .\TwelveRanks.slnx
          --configuration Release
          --no-restore
          -p:Platform=x64
          -p:ContinuousIntegrationBuild=true
          -p:GenerateAppxPackageOnBuild=false
          -p:AppxPackageSigningEnabled=false

      - name: Test
        shell: pwsh
        run: >-
          dotnet test .\TwelveRanks.Tests\TwelveRanks.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          -p:Platform=x64
          --logger "console;verbosity=normal"
